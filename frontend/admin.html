<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — FashionHub</title>
  <link rel="icon" href="assets/images/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <div id="site-header"></div>
  <main class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
        <div><h1 class="mb-1">Admin Dashboard</h1><p class="text-muted mb-0">Manage customers, orders, and inventory.</p></div>
        <button id="refresh-admin" class="btn btn-outline-primary"><i class="fas fa-sync-alt mr-1"></i>Refresh</button>
      </div>
      <div id="admin-error"></div>
      <div class="row mb-4" id="admin-stats"></div>
      <div class="order-summary mb-4"><h5>Orders &amp; Fulfillment</h5><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Courier</th><th>Tracking number</th><th>Actions</th></tr></thead><tbody id="admin-orders"></tbody></table></div></div>
      <div class="row">
        <div class="col-lg-7 mb-4"><div class="order-summary h-100"><h5>Registered Customers</h5><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody id="admin-users"></tbody></table></div></div></div>
        <div class="col-lg-5 mb-4"><div class="order-summary h-100"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Inventory</h5><button id="bulk-stock-save" class="btn btn-sm btn-primary">Save selected stock</button></div><div class="table-responsive"><table class="table table-hover"><thead><tr><th><input id="select-all-stock" type="checkbox" aria-label="Select all products"></th><th>Product</th><th>Stock</th><th>Save</th><th>Price</th></tr></thead><tbody id="admin-products"></tbody></table></div></div></div>
      </div>
      <section class="order-summary mb-4">
        <h5>Coupon management</h5>
        <form id="coupon-form" class="form-row align-items-end mb-4">
          <div class="form-group col-md-3"><label for="coupon-code">Code</label><input id="coupon-code" class="form-control" maxlength="30" required></div>
          <div class="form-group col-md-2"><label for="coupon-discount">Discount %</label><input id="coupon-discount" type="number" class="form-control" min="1" max="100" required></div>
          <div class="form-group col-md-2"><label for="coupon-minimum">Minimum ₹</label><input id="coupon-minimum" type="number" class="form-control" min="0" value="0" required></div>
          <div class="form-group col-md-3"><label for="coupon-expiry">Expires</label><input id="coupon-expiry" type="datetime-local" class="form-control" required></div>
          <div class="form-group col-md-2"><button class="btn btn-primary btn-block" type="submit">Create coupon</button></div>
        </form>
        <div class="table-responsive"><table class="table table-hover"><thead><tr><th>Code</th><th>Discount</th><th>Minimum</th><th>Expires</th><th>State</th><th>Actions</th></tr></thead><tbody id="admin-coupons"></tbody></table></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/render.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
